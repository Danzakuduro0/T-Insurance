                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        schemaVersion:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - status
      - schemaVersion
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - error
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserDto'
      required:
      - accessToken
      - accessTokenExpiresIn
      - refreshToken
      - user
    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          type: string
          enum:
          - CLIENT
          - OPERATOR
          - ADMIN
        fullName:
          type: string
        phone:
          anyOf:
          - type: string
          - type: 'null'
        email:
          anyOf:
          - type: string
          - type: 'null'
        availability:
          anyOf:
          - type: string
            enum:
            - ONLINE
            - BREAK
            - OFFLINE
          - type: 'null'
      required:
      - id
      - role
      - fullName
      - phone
      - email
    MobileLoginRequest:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
        device:
          $ref: '#/components/schemas/DeviceInfo'
      required:
      - phone
      - password
      - device
    DeviceInfo:
      type: object
      properties:
        installationId:
          type: string
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
        appVersion:
          anyOf:
          - type: string
          - type: 'null'
        osVersion:
          anyOf:
          - type: string
          - type: 'null'
        pushToken:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - installationId
      - platform
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    OperatorLoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    PolicyDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        policyNumber:
          type: string
        product:
          type: string
        insuredObject:
          type: object
          additionalProperties: true
        validFrom:
          type: string
        validTo:
          type: string
      required:
      - id
      - policyNumber
      - product
      - insuredObject
      - validFrom
      - validTo
    EventTypeDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldDto'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FormDocumentDto'
      required:
      - code
      - name
      - fields
      - documents
    FormFieldDto:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        kind:
          type: string
          enum:
          - CORE
          - DETAIL
        valueType:
          type: string
          enum:
          - STRING
          - BOOLEAN
          - NUMBER
          - LIST
        required:
          type: boolean
      required:
      - code
      - title
      - kind
      - valueType
      - required
    FormDocumentDto:
      type: object
      properties:
        documentType:
          type: string
        name:
          type: string
        minCount:
          type: integer
          format: int32
        allowedMimeTypes:
          type: array
          items:
            type: string
        maxSizeBytes:
          type: integer
          format: int64
      required:
      - documentType
      - name
      - minCount
      - allowedMimeTypes
      - maxSizeBytes
    ClaimListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        claimNumber:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - NEEDS_INFO
          - IN_ANALYSIS
          - QUEUED
          - ASSIGNED
          - IN_REVIEW
          - COMPLETED
          - CANCELLED
        statusTitle:
          type: string
        isFinal:
          type: boolean
        eventTypeName:
          anyOf:
          - type: string
          - type: 'null'
        eventAt:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
        updatedAt:
          type: string
        actionRequired:
          type: boolean
        actionMessage:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - claimNumber
      - status
      - statusTitle
      - isFinal
      - eventTypeName
      - eventAt
      - createdAt
      - updatedAt
      - actionRequired
      - actionMessage
    ClaimDetails:
      type: object
      properties:
        id:
          type: integer
          format: int64
        claimNumber:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - NEEDS_INFO
          - IN_ANALYSIS
          - QUEUED
          - ASSIGNED
          - IN_REVIEW
          - COMPLETED
          - CANCELLED
        statusTitle:
          type: string
        isFinal:
          type: boolean
        policyId:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        policyNumber:
          anyOf:
          - type: string
          - type: 'null'
        eventType:
          anyOf:
          - type: string
          - type: 'null'
        eventTypeName:
          anyOf:
          - type: string
          - type: 'null'
        eventAt:
          anyOf:
          - type: string
          - type: 'null'
        eventLocation:
          anyOf:
          - type: string
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
        contactPhone:
          anyOf:
          - type: string
          - type: 'null'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantDto'
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
        updatedAt:
          type: string
        submittedAt:
          anyOf:
          - type: string
          - type: 'null'
        openInfoRequest:
          anyOf:
          - $ref: '#/components/schemas/InfoRequestDto'
          - type: 'null'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ClaimFileDto'
      required:
      - id
      - claimNumber
      - status
      - statusTitle
      - isFinal
      - policyId
      - policyNumber
      - eventType
      - eventTypeName
      - eventAt
      - eventLocation
      - description
      - contactPhone
      - participants
      - details
      - createdAt
      - updatedAt
      - submittedAt
      - openInfoRequest
      - files
    ParticipantDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          type: string
        fullName:
          type: string
        phone:
          anyOf:
          - type: string
          - type: 'null'
        vehicle:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        insurer:
          anyOf:
          - type: string
          - type: 'null'
        note:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - role
      - fullName
      - phone
      - vehicle
      - insurer
      - note
    InfoRequestDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - FULFILLED
          - CANCELLED
        dueAt:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InfoRequestItemDto'
      required:
      - id
      - message
      - status
      - dueAt
      - createdAt
      - items
    InfoRequestItemDto:
      type: object
      properties:
        documentType:
          anyOf:
          - type: string
          - type: 'null'
        documentTypeName:
          anyOf:
          - type: string
          - type: 'null'
        fieldName:
          anyOf:
          - type: string
          - type: 'null'
        minCount:
          type: integer
          format: int32
        comment:
          anyOf:
          - type: string
          - type: 'null'
        issue:
          type: string
          enum:
          - MISSING
          - INVALID_FORMAT
          - LOW_QUALITY
        hint:
          anyOf:
          - type: string
          - type: 'null'
        fileId:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        isFulfilled:
          type: boolean
      required:
      - documentType
      - documentTypeName
      - fieldName
      - minCount
      - comment
      - issue
      - hint
      - fileId
      - isFulfilled
    ClaimFileDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        documentType:
          type: string
        documentTypeName:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - UPLOADED
          - ACCEPTED
          - REJECTED
          - DUPLICATE
