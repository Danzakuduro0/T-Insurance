        in: query
        description: me или none
        schema:
          type: string
      - name: assignedTo
        in: query
        description: ''
        schema:
          type: integer
      - name: eventType
        in: query
        description: ''
        schema:
          type: string
      - name: createdFrom
        in: query
        description: YYYY-MM-DD включительно
        schema:
          type: string
      - name: createdTo
        in: query
        description: YYYY-MM-DD включительно
        schema:
          type: string
      - name: tz
        in: query
        description: IANA, например Asia/Krasnoyarsk
        schema:
          type: string
      - name: overdue
        in: query
        description: ''
        schema:
          type: boolean
      - name: manualReview
        in: query
        description: ''
        schema:
          type: boolean
      - name: search
        in: query
        description: ''
        schema:
          type: string
      - name: limit
        in: query
        description: 1–200, по умолчанию 50
        schema:
          type: integer
      - name: offset
        in: query
        description: По умолчанию 0
        schema:
          type: integer
      responses:
        '200':
          description: Результат операции
          content:
            application/json:
              schema:
